<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAISAE Workbench</title>
<style>
:root{color-scheme:light dark;--petal-fill:#fff;--petal-stroke:#000;--bg:#fff;--text:#202124;--muted:#71757b;--border:#e8e9eb;--hover:#f8f9fa;--focus:#467fa8;font-family:var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
@media(prefers-color-scheme:dark){:root{--petal-fill:currentColor;--petal-stroke:none;--bg:#191a1c;--text:#eeeff1;--muted:#a4a7ae;--border:#34363b;--hover:#25272b;--focus:#88b6d8}}
:root[data-theme=light]{color-scheme:light;--petal-fill:#fff;--petal-stroke:#000;--bg:#fff;--text:#202124;--muted:#71757b;--border:#e8e9eb;--hover:#f8f9fa;--focus:#467fa8}
:root[data-theme=dark]{color-scheme:dark;--petal-fill:currentColor;--petal-stroke:none;--bg:#191a1c;--text:#eeeff1;--muted:#a4a7ae;--border:#34363b;--hover:#25272b;--focus:#88b6d8}
*{box-sizing:border-box}body{margin:0;background:var(--color-background-primary,var(--bg));color:var(--color-text-primary,var(--text))}
main{width:100%;max-width:816px;margin:0 auto;padding:48px 24px 24px}header{text-align:center;margin-bottom:40px}.mark{width:64px;height:64px;margin:0 auto 12px}.mark ellipse{fill:var(--petal-fill);stroke:var(--petal-stroke);stroke-width:.25}.mark circle{fill:#f2c94c}.mark svg{width:100%;height:100%;display:block}h1{font-size:24px;line-height:32px;font-weight:500;letter-spacing:.07px;margin:0 0 8px}header p{font-size:14px;line-height:20px;color:var(--color-text-tertiary,var(--muted));margin:0}h2{font-size:16px;font-weight:600;margin:0 0 16px;line-height:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{position:relative;min-height:160px;padding:18px 16px;border:1px solid var(--color-border-tertiary,var(--border));border-radius:20px;background:var(--color-background-primary,var(--bg));color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:12px;box-shadow:0 2px 6px #00000005;transition:background .14s,border-color .14s,box-shadow .14s}
.card:hover{background:var(--hover);border-color:var(--accent);box-shadow:0 4px 12px #0000000a}.card:focus-visible,.copy:focus-visible{outline:2px solid var(--focus);outline-offset:4px}.card:disabled{cursor:wait;opacity:.65}.card-top{display:flex;align-items:center;justify-content:space-between;width:100%;height:24px}.task-icon{width:24px;height:24px;color:var(--accent)}.arrow{width:16px;height:16px;color:var(--muted);opacity:.65}.card-title{font-size:14px;font-weight:600;line-height:20px}.description{font-size:13px;line-height:19px;color:var(--color-text-secondary,var(--muted));margin-top:-6px}.status{min-height:20px;font-size:12px;line-height:20px;color:var(--muted);margin:20px 0 0}.status.error{color:#bc4141}.fallback{border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:16px}.fallback[hidden]{display:none}.fallback p{font-size:13px;line-height:20px;margin:0 0 12px}.fallback textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:12px;font:inherit;font-size:13px;background:var(--bg);color:inherit}.copy{border:1px solid var(--border);border-radius:8px;padding:8px 14px;background:var(--hover);color:inherit;margin-top:8px;cursor:pointer}button svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:32px 20px 20px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.card{min-height:140px}main{padding:28px 16px 16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div class="mark" aria-hidden="true"><!--DAISY--></div><h1>DAISAE Workbench</h1><p>Discover starter tasks for your research area.</p></header><section aria-labelledby="tasks-heading"><h2 id="tasks-heading">Start a research task</h2><div class="grid" id="tasks"></div></section><p class="status" id="status" role="status" aria-live="polite"></p><section id="fallback" class="fallback" hidden aria-label="Starter prompt"><p id="fallback-title">Copy this starter prompt into a chat to begin.</p><textarea id="prompt" readonly aria-label="Starter task prompt"></textarea><button class="copy" id="copy" type="button">Copy prompt</button></section></main><!--APP_SCRIPT--></body></html>
